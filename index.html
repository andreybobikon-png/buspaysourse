<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Городской Транспорт — демо</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
    <main class="main">
      <div class="demo-mark"><span>ДЕМО · НЕ ЯВЛЯЕТСЯ ПРОЕЗДНЫМ БИЛЕТОМ</span><button id="openEditor" type="button" aria-label="Настройки демо">⚙</button></div>
      <div class="valid" id="validity" role="timer" aria-live="off">Действует: 00:15</div>

      <div class="tabs">
        <button class="tab selected" id="ticketTab" type="button">
          <span class="ticket-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="13" height="16" rx="2"/><path d="M8 9h6M8 13h4M17 7l2 2-4 4"/></svg>
          </span>
          <span id="ticketNo">1 551 773 539</span>
        </button>
        <button class="tab control" id="controlTab" type="button">
          <span class="control-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="2.5"/><path d="M4 14c.8-2.2 7.2-2.2 8 0M15 5l2 2 3-3M15 11h5M15 15h5"/></svg>
          </span>
          Контроль
        </button>
      </div>

      <section class="details" aria-label="Демонстрационные данные">
        <div class="row">
          <div class="icon person" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M5 12c1.2-3 12.8-3 14 0M7 17c1.5-2.5 10.5-2.5 10 0M9 19l-2 2M15 19l2 2"/></svg>
          </div>
          <div class="copy"><div class="caption">Перевозчик</div><div class="value" id="carrier"></div></div>
        </div>
        <div class="row">
          <div class="icon bus" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 12h16M7 19v2M17 19v2M7 9h3M14 9h3M7 15h.1M17 15h.1"/></svg>
          </div>
          <div class="copy"><div class="caption" id="route"></div><div class="value" id="bus"></div></div>
        </div>
        <div class="row">
          <div class="icon ruble" aria-hidden="true">₽</div>
          <div class="copy"><div class="caption">Стоимость</div><div class="value" id="cost"></div></div>
        </div>
        <div class="row">
          <div class="icon calendar" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16M8 13h3"/></svg>
          </div>
          <div class="copy"><div class="caption">Дата покупки</div><div class="value" id="date"></div></div>
        </div>
        <div class="row last">
          <div class="icon clock" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>
          </div>
          <div class="copy"><div class="caption">Время покупки</div><div class="value" id="time"></div></div>
        </div>
      </section>
      <p class="demo-note">Учебный макет интерфейса. Не предназначен для предъявления в транспорте.</p>
    </main>

    <footer class="footer">
      <button id="closeTicket" type="button">ЗАКРЫТЬ</button>
    </footer>
  </div>

  <div class="editor hidden" id="editor">
    <div class="sheet">
      <div class="sheet-head"><b>Данные демо-макета</b><button id="cancel" type="button" aria-label="Закрыть">×</button></div>
      <label>Номер макета<input id="fTicket"></label>
      <label>Перевозчик<input id="fCarrier"></label>
      <label>Маршрут<input id="fRoute"></label>
      <label>Номер автобуса<input id="fBus"></label>
      <label>Количество<input id="fCount" type="number" min="1"></label>
      <label>Тариф<input id="fTariff"></label>
      <label>Стоимость<input id="fPrice"></label>
      <label>Дата покупки<input id="fDate"></label>
      <label>Время покупки<input id="fTime"></label>
      <button class="save" id="save" type="button">СОХРАНИТЬ</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
