<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Городской Транспорт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#000;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Arial,sans-serif}
body{min-height:100vh;overflow:hidden}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.screen{width:100%;height:100dvh;min-height:100vh;background:#000;display:flex;flex-direction:column;overflow:hidden}
.header{height:80px;padding:0 16px;border-bottom:1px solid #1d1d1d;display:grid;grid-template-columns:76px 1fr 34px;align-items:center}
.header-spacer{width:76px;height:1px}.back{border:0;background:transparent;color:#3f82f5;padding:0;text-align:left;font-size:16px;font-weight:500}
.title-wrap{text-align:center;transform:translateY(1px)}
.title{font-size:17px;line-height:18px;font-weight:700;letter-spacing:-.15px}
.subtitle{font-size:11px;line-height:14px;color:#707070;font-weight:600}
.more{width:50px;height:50px;border:0;border-radius:50%;background:transparent;color:#367bf0;padding:0;position:absolute;top:1px;right:2px;z-index:20;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer}
.more span{width:25px;height:25px;border:2px solid #367bf0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#000;color:#367bf0;padding:0;font-size:11px;line-height:1;letter-spacing:1px}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;padding-bottom:24px;position:relative}
.valid{height:69px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:500;letter-spacing:-.4px}
.tabs{height:42px;border-bottom:1px solid #242424;display:grid;grid-template-columns:1fr 1fr}
.tab{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative;border:0;background:#000;color:#8c8c8c;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0;z-index:10}
.tab.selected{color:#e9181c}
.tab.selected:after{content:"";position:absolute;height:2px;background:#e9181c;bottom:-1px;left:0;right:0}
.ticket-ico svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.control-ico svg{width:20px;height:20px;stroke:#aaa;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.details{padding:0 24px}
.row{height:71px;border-bottom:1px solid #202020;display:grid;grid-template-columns:48px 1fr;align-items:center}
.row.last{border-bottom:0}
.icon{width:27px;height:27px;color:#dcdcdc;display:flex;align-items:center;justify-content:center}
.icon svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon.ruble{font-size:29px;font-weight:300}
.copy{min-width:0}
.caption{font-size:15px;color:#6e6e6e;line-height:18px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.value{font-size:22px;line-height:27px;color:#e5e5e5;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer{height:67px;padding:11px 16px 8px;background:#080808;border-top:1px solid #171717}
.footer button{height:48px;width:100%;border:0;border-radius:10px;background:#ef1117;color:#fff;font-size:16px;font-weight:800}
.editor{position:fixed;inset:0;background:rgba(0,0,0,.70);display:flex;align-items:flex-end;z-index:50}
.editor.hidden{display:none}
.sheet{width:100%;max-height:92vh;overflow:auto;background:#171717;border-radius:20px 20px 0 0;padding:18px 16px 25px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-size:20px;margin-bottom:8px}
.sheet-head button{border:0;background:none;color:#aaa;font-size:30px;line-height:24px}
label{display:block;color:#aaa;font-size:12px;margin:10px 0}
input{width:100%;display:block;margin-top:5px;height:40px;border:1px solid #3b3b3b;border-radius:8px;background:#080808;color:#fff;padding:0 10px;font-size:15px;outline:none}
.save{margin-top:12px;width:100%;height:46px;border:0;border-radius:9px;background:#ef1117;color:#fff;font-weight:800}
@media(min-width:600px){.screen{max-width:384px;margin:0 auto;min-height:848px}}
.hidden{display:none!important}
.tab.muted{color:#8c8c8c}
.control-panel{padding:24px 24px 32px;text-align:center}
.qr-wrap{width:214px;height:214px;margin:22px auto 14px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:12px}
#qrCode{width:190px;height:190px;display:flex;align-items:center;justify-content:center}
#qrCode img{display:block;width:190px;height:190px;max-width:190px;max-height:190px}
</style>
</head>
<body>
<div class="screen">
  <main class="main">
    <button class="more" id="openEditor" type="button" aria-label="Настройки"><span>•••</span></button>
    <div class="valid" id="validity">Действует: 20 сек.</div>
    <div class="tabs">
      <button class="tab selected" id="ticketTab" type="button">
        <span class="ticket-ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="13" height="16" rx="2"/><path d="M8 9h6M8 13h4M17 7l2 2-4 4"/></svg></span>
        <span id="ticketNo">1 551 773 539</span>
      </button>
      <button class="tab control" id="controlTab" type="button">
        <span class="control-ico"><svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="2.5"/><path d="M4 14c.8-2.2 7.2-2.2 8 0M15 5l2 2 3-3M15 11h5M15 15h5"/></svg></span>
        Контроль
      </button>
    </div>
    <section class="details" id="ticketDetails">
      <div class="row"><div class="icon person"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M5 12c1.2-3 12.8-3 14 0M7 17c1.5-2.5 10.5-2.5 10 0M9 19l-2 2M15 19l2 2"/></svg></div><div class="copy"><div class="caption">Перевозчик</div><div class="value" id="carrier">ИП Тагачаков В. Г.</div></div></div>
      <div class="row"><div class="icon bus"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 12h16M7 19v2M17 19v2M7 9h3M14 9h3M7 15h.1M17 15h.1"/></svg></div><div class="copy"><div class="caption" id="route">Спортзал - Академия биатлона</div><div class="value" id="bus">о119се124</div></div></div>
      <div class="row"><div class="icon ruble">₽</div><div class="copy"><div class="caption">Стоимость</div><div class="value" id="cost">1 шт., Полный, 48.00 ₽</div></div></div>
      <div class="row"><div class="icon calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16M8 13h3"/></svg></div><div class="copy"><div class="caption">Дата покупки</div><div class="value" id="date">—</div></div></div>
      <div class="row last"><div class="icon clock"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg></div><div class="copy"><div class="caption">Время покупки</div><div class="value" id="time">—</div></div></div>
    </section>
    <section class="control-panel hidden" id="controlPanel"><div class="qr-wrap"><div id="qrCode"></div></div></section>
  </main>
  <footer class="footer"><button id="closeTicket">ЗАКРЫТЬ</button></footer>
</div>

<div class="editor hidden" id="editor">
  <div class="sheet">
    <div class="sheet-head"><b>Данные билета</b><button id="cancel">×</button></div>
    <label>Срок действия<input id="fValidity"></label>
    <label>Номер билета<input id="fTicket"></label>
    <label>Перевозчик<input id="fCarrier"></label>
    <label>Маршрут<input id="fRoute"></label>
    <label>Номер автобуса<input id="fBus"></label>
    <label>Количество<input id="fCount" type="number" min="1"></label>
    <label>Тариф<input id="fTariff"></label>
    <label>Стоимость<input id="fPrice" readonly></label>
    <label>Дата покупки<input id="fDate"></label>
    <label>Время покупки<input id="fTime"></label>
    <button class="save" id="save">СОХРАНИТЬ</button>
  </div>
</div>

<script>
const APP_VERSION="2026-11-14-8";

const DEFAULTS={
  validity:"Действует: 20 сек.",
  ticket:"1 551 773 539",
  carrier:"ИП Тагачаков В. Г.",
  route:"Спортзал - Академия биатлона",
  bus:"о119се124",
  count:1,
  tariff:"Полный",
  price:"48.00 ₽",
  date:"",
  time:""
};

const MONTHS_RU=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

const FIXED_QR_DATA="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUoAAAFKAQAAAABTUiuoAAAB8klEQVR4nO2aQY7bMAxFH2sBWdo3yFHkmw16pN7APopvYC8DyPhdSHaTybRIZhCPgJKrWHiLDxCkPqmYeDDGH4+S4KijjjrqqKOvRK1EwPrFDFgNlu24f7kAR59BoyRpBsZzApaTgEaSpFv0NQIcfQZdthKKU8DsfMmfZhaOEeDoAxHefQtSIP4KiOUIAY5+IVsGjRi7Jh0kwNFPoK2kAdDAasQZrAckpffoawQ4+jg6mplZB/Y2N7I+n67ZEh4hwNFHwu42T0sHcN8JffNUC2r9VkdmHUB7KaXWLz5vVYeOdpKGNpGHrjgFNADQ+rxVHRrn1WAJWJ/T04g4mTH6vVURujv4JkE7598azxcjDoKxB71SgKNPoOTdUpwbSXMjaBPEGXITjEoZ0fDtWh29yZbStjHcpqxyjXm26kC52tvGGTS0ieIttirz2qoMjbkJlrxJU9jaIfuwXIvW/xjdXEabyINxnE6l1MZsBlf3hNWgpc3tsR03IspdRpXon7fjnJ6BMn4xdmW/W41WR6/ejllOsrcrL9/4LqMadHfw3FiN9q4neiesEY1TQJrMym3VXtxlVIvq5zlhPeQr63gBjv4jdgcvyH/EWEJS2Q2uAQi+J6wG5UPfDuUGy88mfm9Vgt6/Hf8t/O3YUUcdddTR70d/AzT+Hq0MawNTAAAAAElFTkSuQmCC";

document.addEventListener("DOMContentLoaded",()=>{
  const tg=(window.Telegram&&window.Telegram.WebApp)||null;
  if(tg){
    try{tg.ready();}catch(e){}
    try{tg.expand();}catch(e){}
    try{tg.setHeaderColor("#000000");tg.setBackgroundColor("#000000");}catch(e){}
  }

  const $=id=>document.getElementById(id);
  let remaining=20;
  let countdownTimer=null;
  let countdownEnd=0;

  function formatCurrentDate(date=new Date()){
    return `${date.getDate()} ${MONTHS_RU[date.getMonth()]} ${date.getFullYear()} г.`;
  }
  function formatCurrentTime(date=new Date()){
    return `${String(date.getHours()).padStart(2,"0")}:${String(date.getMinutes()).padStart(2,"0")}`;
  }
  function priceForCount(count){
    const n=Math.max(1,Number(count)||1);
    return `${(n*48).toFixed(2)} ₽`;
  }
  function nonEmpty(value,fallback){
    return typeof value==="string" && value.trim()!=="" ? value : fallback;
  }
  function load(){
    let saved={};
    try{
      saved=JSON.parse(localStorage.getItem("buspay_pixel")||"{}");
    }catch(e){}
    if(!saved || typeof saved!=="object") saved={};
    const now=new Date();
    const count=Math.max(1,Number(saved.count)||DEFAULTS.count);
    return {
      ...DEFAULTS,
      ticket:nonEmpty(saved.ticket,DEFAULTS.ticket),
      carrier:nonEmpty(saved.carrier,DEFAULTS.carrier),
      route:nonEmpty(saved.route,DEFAULTS.route),
      bus:nonEmpty(saved.bus,DEFAULTS.bus),
      count,
      tariff:nonEmpty(saved.tariff,DEFAULTS.tariff),
      price:priceForCount(count),
      validity:nonEmpty(saved.validity,DEFAULTS.validity),
      date:formatCurrentDate(now),
      time:formatCurrentTime(now)
    };
  }

  let d=load();

  function persist(){
    try{localStorage.setItem("buspay_pixel",JSON.stringify(d));}catch(e){}
  }

  function render(){
    $("validity").textContent=`Действует: ${remaining} сек.`;
    $("ticketNo").textContent=d.ticket;
    $("carrier").textContent=d.carrier;
    $("route").textContent=d.route;
    $("bus").textContent=d.bus;
    $("cost").textContent=`${d.count} шт., ${d.tariff}, ${priceForCount(d.count)}`;
    $("date").textContent=d.date;
    $("time").textContent=d.time;
  }

  function fill(){
    $("fValidity").value=d.validity||DEFAULTS.validity;
    $("fTicket").value=d.ticket;
    $("fCarrier").value=d.carrier;
    $("fRoute").value=d.route;
    $("fBus").value=d.bus;
    $("fCount").value=d.count;
    $("fTariff").value=d.tariff;
    $("fPrice").value=priceForCount(d.count);
    $("fDate").value=d.date;
    $("fTime").value=d.time;
  }

  function startCountdown(){
    if(countdownTimer) clearInterval(countdownTimer);
    remaining=20;
    countdownEnd=Date.now()+20000;
    render();
    countdownTimer=setInterval(()=>{
      const left=Math.ceil((countdownEnd-Date.now())/1000);
      if(left<=0){
        remaining=20;
        countdownEnd=Date.now()+20000;
      }else{
        remaining=left;
      }
      render();
    },200);
  }

  function refreshEntryDateTime(){
    const now=new Date();
    d.date=formatCurrentDate(now);
    d.time=formatCurrentTime(now);
    persist();
    render();
  }

  function showControl(){
    $("ticketDetails").classList.add("hidden");
    $("controlPanel").classList.remove("hidden");
    $("ticketTab").classList.remove("selected");
    $("ticketTab").classList.add("muted");
    $("controlTab").classList.add("selected");
    const qr=$("qrCode");
    if(qr && !qr.querySelector("img")){
      qr.innerHTML=`<img src="${FIXED_QR_DATA}" alt="Тестовый QR-код">`;
    }
  }

  function showTicket(){
    $("controlPanel").classList.add("hidden");
    $("ticketDetails").classList.remove("hidden");
    $("controlTab").classList.remove("selected");
    $("ticketTab").classList.remove("muted");
    $("ticketTab").classList.add("selected");
  }

  // Кнопка с тремя точками
  $("openEditor").addEventListener("click",e=>{
    e.preventDefault();
    e.stopPropagation();
    fill();
    $("editor").classList.remove("hidden");
  });

  $("fCount").addEventListener("input",()=>{
    const count=Math.max(1,Number($("fCount").value)||1);
    $("fPrice").value=priceForCount(count);
  });

  $("cancel").addEventListener("click",()=>{
    $("editor").classList.add("hidden");
  });

  $("save").addEventListener("click",()=>{
    const count=Math.max(1,Number($("fCount").value)||1);
    const oldDate=d.date;
    const oldTime=d.time;
    d={
      validity:$("fValidity").value.trim()||DEFAULTS.validity,
      ticket:$("fTicket").value.trim()||DEFAULTS.ticket,
      carrier:$("fCarrier").value.trim()||DEFAULTS.carrier,
      route:$("fRoute").value.trim()||DEFAULTS.route,
      bus:$("fBus").value.trim()||DEFAULTS.bus,
      count,
      tariff:$("fTariff").value.trim()||DEFAULTS.tariff,
      price:priceForCount(count),
      date:$("fDate").value.trim()||oldDate,
      time:$("fTime").value.trim()||oldTime
    };
    persist();
    $("editor").classList.add("hidden");
    render();
  });

  $("closeTicket").addEventListener("click",()=>{
    if(tg && typeof tg.close==="function"){
      try{tg.close();}catch(e){}
    }
  });

  $("ticketTab").addEventListener("click",showTicket);
  $("controlTab").addEventListener("click",showControl);

  function onAppVisible(){
    refreshEntryDateTime();
    startCountdown();
  }

  window.addEventListener("pageshow",onAppVisible);
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden) onAppVisible();
  });

  // Первый запуск: дата/время = момент открытия приложения.
  refreshEntryDateTime();
  startCountdown();
});

</script>
</body>
</html>
