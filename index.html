<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Городской Транспорт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <main class="main">
    <button class="more" id="openEditor" aria-label="Настройки">•••</button>
    <div class="valid" id="validity">Действует: 15 сек.</div>

    <div class="tabs">
      <button class="tab selected" id="ticketTab">
        <span class="ticket-ico">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="13" height="16" rx="2"/><path d="M8 9h6M8 13h4M17 7l2 2-4 4"/></svg>
        </span>
        <span id="ticketNo">1 551 773 539</span>
      </button>
      <button class="tab control">
        <span class="control-ico">
          <svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="2.5"/><path d="M4 14c.8-2.2 7.2-2.2 8 0M15 5l2 2 3-3M15 11h5M15 15h5"/></svg>
        </span>
        Контроль
      </button>
    </div>

    <section class="details" id="ticketDetails">
      <div class="row">
        <div class="icon person">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M5 12c1.2-3 12.8-3 14 0M7 17c1.5-2.5 10.5-2.5 10 0M9 19l-2 2M15 19l2 2"/></svg>
        </div>
        <div class="copy">
          <div class="caption">Перевозчик</div>
          <div class="value" id="carrier"></div>
        </div>
      </div>

      <div class="row">
        <div class="icon bus">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 12h16M7 19v2M17 19v2M7 9h3M14 9h3M7 15h.1M17 15h.1"/></svg>
        </div>
        <div class="copy">
          <div class="caption" id="route"></div>
          <div class="value" id="bus"></div>
        </div>
      </div>

      <div class="row">
        <div class="icon ruble">₽</div>
        <div class="copy">
          <div class="caption">Стоимость</div>
          <div class="value" id="cost"></div>
        </div>
      </div>

      <div class="row">
        <div class="icon calendar">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16M8 13h3"/></svg>
        </div>
        <div class="copy">
          <div class="caption">Дата покупки</div>
          <div class="value" id="date"></div>
        </div>
      </div>

      <div class="row last">
        <div class="icon clock">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>
        </div>
        <div class="copy">
          <div class="caption">Время покупки</div>
          <div class="value" id="time"></div>
        </div>
      </div>
    </section>
    <section class="control-panel hidden" id="controlPanel">
      <div class="qr-title">QR-код</div>
      <div class="qr-subtitle">Код генерируется автоматически</div>
      <div class="qr-wrap"><div id="qrCode"></div></div>
      <div class="qr-code-text" id="qrText"></div>
    </section>

  </main>

  <footer class="footer">
    <button id="closeTicket">ЗАКРЫТЬ</button>
  </footer>
</div>


<div class="editor hidden" id="editor">
  <div class="sheet">
    <div class="sheet-head">
      <b>Данные билета</b>
      <button id="cancel">×</button>
    </div>
    <label>Срок действия<input id="fValidity"></label>
    <label>Номер билета<input id="fTicket"></label>
    <label>Перевозчик<input id="fCarrier"></label>
    <label>Маршрут<input id="fRoute"></label>
    <label>Номер автобуса<input id="fBus"></label>
    <label>Количество<input id="fCount" type="number" min="1"></label>
    <label>Тариф<input id="fTariff"></label>
    <label>Стоимость<input id="fPrice" readonly></label>
    <label>Дата покупки<input id="fDate"></label>
    <label>Время покупки<input id="fTime"></label>
    <button class="save" id="save">СОХРАНИТЬ</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
